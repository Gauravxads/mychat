# Builds the Android APK on every change and publishes it as a GitHub Release.
# Share link (always the newest build):
#   https://github.com/<your-username>/<repo-name>/releases/latest/download/MyChat.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install and bundle the app
        run: |
          npm ci
          BUILD_NUMBER=${{ github.run_number }} npm run build

      - name: Create the Android project
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          # Keep the keyboard from covering the message box
          sed -i 's/<activity/<activity android:windowSoftInputMode="adjustResize"/' $M
          # In-app updater: permission to open the installer, plus the native plugin
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n</manifest>#' $M
          cp native/*.java android/app/src/main/java/com/mychat/app/
          # Version = build number, so Android treats each build as a newer version
          sed -i 's/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -n "REQUEST_INSTALL_PACKAGES\|adjustResize" $M

      - name: Use the repo's signing key (so new versions install over old ones)
        run: |
          base64 -d debug.keystore.b64 > android/app/mychat.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          // Always sign with the repo's fixed key (otherwise every build gets a random key
          // and Android refuses to install updates over the previous version).
          android {
              signingConfigs {
                  mychat {
                      storeFile file('mychat.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.mychat
                  }
              }
          }
          GRADLE
          tail -20 android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MyChat.apk

      - name: Check the APK is signed with the fixed key
        run: |
          EXPECTED="2b:c8:ef:5e:bf:74:30:8f:06:13:74:59:3c:d5:b8:7b:3b:cb:5d:a9:e0:02:cb:25:98:82:97:59:fa:ac:5a:65"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs MyChat.apk | tee certs.txt
          ACTUAL=$(grep -m1 "SHA-256 digest" certs.txt | awk '{print $NF}' | sed 's/../&:/g; s/:$//')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then echo "::error::APK is not signed with the repo key"; exit 1; fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: MyChat build ${{ github.run_number }}
          files: MyChat.apk
          make_latest: true
